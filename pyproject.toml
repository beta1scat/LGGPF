[project]
name = "lggpf"
version = "0.1.0"
description = "Language-Guided Grasping via Primitive Fitting (LGGPF)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LGGPF Authors" },
]
keywords = ["robotics", "grasping", "point-cloud", "shape-fitting", "language-guided"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "segment-anything",
    "open3d",
    "spatialmath-python",
    "numpy",
    "scipy",
    "scikit-learn",
    "sympy",
    "opencv-python",
    "matplotlib",
    "Pillow",
    "pyyaml",
]

[project.optional-dependencies]
robot = [
    "pin",
    "coal",
    "meshcat",
]
web = [
    "flask",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lggpf"]
