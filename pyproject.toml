[project]
name = "lggpf"
version = "0.1.0"
description = "Language-Guided Grasping via Primitive Fitting (LGGPF)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.11"
authors = [
    { name = "LGGPF Authors" },
]
keywords = ["robotics", "grasping", "point-cloud", "shape-fitting", "language-guided"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "transformers>=4.36.0, <=4.44.2",
    "segment-anything",
    "open3d",
    "spatialmath-python",
    "numpy",
    "scipy",
    "scikit-learn",
    "sympy",
    "opencv-python",
    "matplotlib",
    "Pillow",
    "pyyaml",
    "easydict",
    "timm<=0.9.16",
    "einops",
    "h5py",
    "termcolor",
    "tqdm",
    "transforms3d",
    "causal-conv1d==1.4.0+cu118torch2.3cxx11abiFALSE; sys_platform == 'linux'",
    "mamba-ssm==1.2.2+cu118torch2.3cxx11abiFALSE; sys_platform == 'linux'",
]

[project.optional-dependencies]
robot = [
    "pin",
    "coal",
    "meshcat",
]
web = [
    "flask",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lggpf"]

[tool.uv]
link-mode = "copy"
find-links = ["wheels"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
[tool.uv.sources]
torch = [
  { url = "https://mirrors.aliyun.com/pytorch-wheels/cu118/torch-2.3.1%2Bcu118-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { url = "https://mirrors.aliyun.com/pytorch-wheels/cu118/torchvision-0.18.1%2Bcu118-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
causal-conv1d = [
  { path = "wheels/causal_conv1d-1.4.0+cu118torch2.3cxx11abiFALSE-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
mamba-ssm = [
  { path = "wheels/mamba_ssm-1.2.2+cu118torch2.3cxx11abiFALSE-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]



